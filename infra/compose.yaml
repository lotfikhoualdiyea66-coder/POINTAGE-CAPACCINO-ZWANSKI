version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cappuccino
      POSTGRES_USER: cappuccino
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: ../apps/api
    env_file:
      - ../apps/api/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata:
